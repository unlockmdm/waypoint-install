<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install Waypoint</title>
<style>
  :root { --ink:#2E2A5A; --muted:#6B6890; --bg:#F5F7FF; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ECEBFA; --muted:#A9A5C8; --bg:#16151F; --card:#211F2E; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:17px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; padding:24px 16px; box-sizing:border-box; }
  main { max-width:420px; width:100%; background:var(--card); border-radius:28px; padding:32px 24px; text-align:center;
         box-shadow:0 10px 30px rgba(46,42,90,.12); }
  img { width:112px; height:112px; border-radius:26px; box-shadow:0 6px 16px rgba(46,42,90,.18); }
  h1 { margin:18px 0 4px; font-size:28px; }
  .v { color:var(--muted); font-size:14px; margin:0 0 24px; }
  a.btn { display:block; padding:16px; border-radius:16px; color:#fff; text-decoration:none; font-weight:700; font-size:19px;
          background:linear-gradient(#FF9573,#FF6B4A); box-shadow:inset 0 -4px 0 rgba(0,0,0,.12); }
  ol { text-align:left; color:var(--muted); font-size:15px; padding-left:22px; margin:24px 0 0; }
  li { margin:6px 0; }
</style></head>
<body><main>
  <img src="icon.png" alt="">
  <h1>Waypoint</h1>
  <p class="v">Test build 0.1.0 (2611251113) · iPad only</p>
  <a class="btn" href="itms-services://?action=download-manifest&amp;url=https://unlockmdm.github.io/waypoint-install/manifest.plist">Install on this iPad</a>
  <ol>
    <li>Open this page in <b>Safari</b> on the iPad, then tap <b>Install</b>.</li>
    <li>Go to the Home Screen and wait for Waypoint to finish downloading (about 270&nbsp;MB).</li>
    <li>Won't install? This iPad isn't registered yet. Send its UDID to Nish.</li>
  </ol>
</main></body></html>
